[package]
name = "alive_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure logic for Alive: state machine, policy engine, snapshot, config and backoff. No Windows calls."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"
